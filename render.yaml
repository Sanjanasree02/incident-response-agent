# Render blueprint: ShopFast and its storefront, on free web services.
# The agent UI runs on Streamlit Community Cloud. Setup steps are in docs/DEPLOY.md.
services:
  - type: web
    name: shopfast-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn shopfast.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs  # always 200; customer endpoints fail on purpose while a fault is on
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SHOPFAST_ADMIN_TOKEN  # guards /admin and /ops on the public URL; copy it into the UI's secrets
        generateValue: true

  - type: web
    name: shopfast-storefront
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn storefront.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SHOPFAST_URL  # https://<shopfast-api URL>, known after the first deploy
        sync: false
