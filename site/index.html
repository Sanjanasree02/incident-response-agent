<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incident Response Agent</title>
  <meta name="description" content="Recalls past ShopFast incidents from Hindsight memory and suggests fixes.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    @media (prefers-color-scheme: dark) { html, body { background: #0e1117; } }
    /* Streamlit Cloud's embed page draws a 1.6px border and a 36px "Built with Streamlit" bar at the bottom.
       The frame is drawn slightly larger than the window, and this box clips the border and the bar. */
    .app { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .app.loaded { pointer-events: auto; }  /* until then, clicks reach the link underneath */
    .app iframe { position: absolute; top: -2px; left: -2px; width: calc(100% + 4px);
                  height: calc(100% + 40px); border: 0; }
    /* Shown until the app paints over it; a sleeping Cloud app can take a while to wake. */
    .loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 8px; text-align: center;
               font: 15px system-ui, sans-serif; color: #31333f; }
    .loading a { color: #ff4b4b; }
    @media (prefers-color-scheme: dark) { .loading { color: #fafafa; } }
  </style>
</head>
<body>
  <div class="loading">
    <p>Loading Incident Response Agent&hellip;</p>
    <p>Taking too long? <a href="https://incident-response-agent-ui.streamlit.app/">Open the app directly</a>.</p>
  </div>
  <div class="app">
    <iframe src="https://incident-response-agent-ui.streamlit.app/?embed=true" title="Incident Response Agent"
            allow="clipboard-write" onload="this.parentNode.classList.add('loaded')"></iframe>
  </div>
</body>
</html>
