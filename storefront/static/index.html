<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopFast Store</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #677084; --line: #e3e6ec;
    --brand: #2f5bea; --ok: #1f8a4c; --ok-bg: #e8f6ee; --bad: #c0392b; --bad-bg: #fdecea;
    --warn: #b26a00; --warn-bg: #fff4e0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; background: var(--card); border-bottom: 1px solid var(--line); }
  .logo { font-weight: 800; letter-spacing: .08em; color: var(--brand); }
  .cart-count { font-weight: 600; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 96px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .product { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .tile { height: 140px; border-radius: 8px; background: #eef1f7; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700; color: var(--brand); overflow: hidden; }
  .tile img { width: 100%; height: 100%; object-fit: cover; }
  .name { font-weight: 600; }
  .price { font-size: 20px; font-weight: 700; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; background: var(--brand); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .note { font-size: 13px; min-height: 18px; }
  .note.bad { color: var(--bad); }
  .note.ok { color: var(--ok); }
  section.cart { margin-top: 28px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .cart h2 { margin: 0 0 10px; font-size: 18px; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .total { display: flex; justify-content: space-between; font-weight: 700; margin: 12px 0; }
  .checkout { width: 100%; padding: 14px; font-size: 16px; }
  .result { margin-top: 16px; border-radius: 10px; padding: 16px; display: none; scroll-margin-bottom: 64px; }
  .result.ok { display: block; background: var(--ok-bg); border: 1px solid #b7e2c7; }
  .result.bad { display: block; background: var(--bad-bg); border: 1px solid #f3c0ba; }
  .result .title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .result.ok .title { color: var(--ok); }
  .result.bad .title { color: var(--bad); }
  .result .line { margin: 2px 0; }
  .result code { display: block; margin-top: 8px; font-size: 12px; white-space: pre-wrap; word-break: break-word; color: #5b2a24; }
  .status { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 24px; background: var(--card); border-top: 1px solid var(--line); font-weight: 600; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--bad); background: var(--bad-bg); }
  .status.recovered { color: var(--ok); background: var(--ok-bg); }
  .status.warn { color: var(--warn); background: var(--warn-bg); }
  .status small { font-weight: 400; color: var(--muted); margin-left: 8px; }
</style>
</head>
<body>
<header>
  <div class="logo">SHOPFAST</div>
  <div class="cart-count" id="cart-count">Cart (0)</div>
</header>

<main>
  <h1>ShopFast Store</h1>
  <p class="sub">Everyday gear, shipped fast.</p>
  <div class="grid" id="products"></div>
  <p class="note bad" id="products-error"></p>

  <section class="cart">
    <h2>Your cart</h2>
    <div id="cart-rows"></div>
    <div class="total"><span>Total</span><span id="cart-total">$0.00</span></div>
    <button class="checkout" id="checkout" disabled>Checkout</button>
    <div class="result" id="result"></div>
  </section>
</main>

<div class="status ok" id="status">● All systems operational</div>

<script>
// Every status and error shown here comes from the real ShopFast response the storefront forwards.
const cart = new Map();          // product id -> {product, quantity}
// Illustrations for ShopFast's product IDs (the API has no image field); unknown products show their initial.
const IMAGES = {
  "sku-100": "/static/images/running-shoes.svg",
  "sku-200": "/static/images/rain-jacket.svg",
  "sku-300": "/static/images/water-bottle.svg",
};
let products = [];
let checkoutFailedBefore = false;

const $ = (id) => document.getElementById(id);
const money = (n) => "$" + Number(n).toFixed(2);

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function setStatus(kind, text, detail) {
  const status = $("status");
  status.className = "status " + kind;
  status.textContent = text;
  if (detail) status.appendChild(el("small", "", detail));
}

async function call(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: body ? {"content-type": "application/json"} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await response.json(); } catch (e) { data = null; }
  return {status: response.status, ok: response.ok, data};
}

function errorText(data) {
  if (!data) return "";
  if (typeof data.error === "string") return data.error;
  if (typeof data.detail === "string") return data.detail;
  return "";
}

async function loadProducts() {
  const res = await call("GET", "/api/products");
  if (!res.ok) {
    $("products-error").textContent = `Catalog unavailable: ${errorText(res.data)} (HTTP ${res.status})`;
    setStatus("warn", "⚠ Catalog degraded", `HTTP ${res.status}`);
    return;
  }
  products = res.data;
  $("products-error").textContent = "";
  renderProducts();
}

function renderProducts() {
  const grid = $("products");
  grid.replaceChildren();
  for (const product of products) {
    const card = el("div", "product");
    const tile = el("div", "tile");
    if (IMAGES[product.id]) {
      const img = el("img");
      img.src = IMAGES[product.id];
      img.alt = product.name;
      tile.appendChild(img);
    } else {
      tile.textContent = product.name.charAt(0);
    }
    card.appendChild(tile);
    card.appendChild(el("div", "name", product.name));
    card.appendChild(el("div", "price", money(product.price)));
    const note = el("div", "note");
    const button = el("button", "", "Add to cart");
    button.addEventListener("click", () => addToCart(product, note, button));
    card.appendChild(button);
    card.appendChild(note);
    grid.appendChild(card);
  }
}

async function addToCart(product, note, button) {
  button.disabled = true;
  const quantity = (cart.get(product.id)?.quantity || 0) + 1;
  const res = await call("POST", "/api/cart/items", {product_id: product.id, quantity});
  button.disabled = false;
  if (!res.ok) {
    note.className = "note bad";
    note.textContent = `Could not add: ${errorText(res.data)} (HTTP ${res.status})`;
    return;
  }
  cart.set(product.id, {product, quantity});
  note.className = "note ok";
  note.textContent = "Added to cart";
  renderCart();
}

function renderCart() {
  const rows = $("cart-rows");
  rows.replaceChildren();
  let total = 0, count = 0;
  for (const {product, quantity} of cart.values()) {
    const row = el("div", "row");
    row.appendChild(el("span", "", `${product.name} × ${quantity}`));
    row.appendChild(el("span", "", money(product.price * quantity)));
    rows.appendChild(row);
    total += product.price * quantity;
    count += quantity;
  }
  if (!count) rows.appendChild(el("div", "note", "Your cart is empty."));
  $("cart-total").textContent = money(total);
  $("cart-count").textContent = `Cart (${count})`;
  $("checkout").disabled = count === 0;
}

function showResult(kind, title, lines, log) {
  const result = $("result");
  result.className = "result " + kind;
  result.replaceChildren(el("div", "title", title));
  for (const line of lines) result.appendChild(el("div", "line", line));
  if (log) result.appendChild(el("code", "", log));
  result.scrollIntoView({block: "nearest"});  // keep the outcome on screen during the demo
}

async function checkout() {
  const button = $("checkout");
  button.disabled = true;
  button.textContent = "Placing order...";
  const items = [...cart.values()].map(({product, quantity}) => ({product_id: product.id, quantity}));
  const res = await call("POST", "/api/checkout", {items});
  button.textContent = "Checkout";
  if (res.ok) {
    const recovered = checkoutFailedBefore;
    showResult("ok", recovered ? "✓ Checkout healthy — order placed successfully" : "✓ Checkout successful",
               [`Order ID: ${res.data.order_id}`, `Total: ${money(res.data.total)}`]);
    setStatus(recovered ? "recovered" : "ok",
              recovered ? "✓ Checkout healthy again" : "● All systems operational");
    checkoutFailedBefore = false;
    cart.clear();
    renderCart();
    return;
  }
  checkoutFailedBefore = res.status >= 500;
  showResult("bad", "⚠ Checkout unavailable", [errorText(res.data), `HTTP ${res.status}`],
             res.data && typeof res.data.log === "string" ? res.data.log : "");
  if (res.status >= 500) setStatus("bad", "⚠ Checkout degraded", `HTTP ${res.status}`);
  button.disabled = cart.size === 0;
}

$("checkout").addEventListener("click", checkout);
renderCart();
loadProducts();
</script>
</body>
</html>
